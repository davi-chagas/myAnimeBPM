
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Novo Post</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/novo-post.css">
    <link rel="icon" href="./assets/imgs/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>

    <div class="header">
        <div class="container">
            <img src="assets/imgs/logo.svg" width="75px" alt="Logo">

            <ul class="navbar">
                <li>
                    <a href="feed.html">Feed</a>
                </li>
                <li>
                    <a href="quiz.html">Quizes</a>
                </li>
                <li>
                    <a class="btn-entrar" href="perfil.html">Perfil</a>
                </li>
                <li>
                    <a class="btn-cadastrar" href="cadastro.html">Sair</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="box">
        <h1 class="titulo-feed">NOVO <span>POST</span></h1>
    </div>

    <main class="novo-post-container">

        <form class="form-post" enctype="multipart/form-data">

            <div class="campo-post">
                <label for="ipt_titulo">Título da publicação</label>
                <input
                    type="text"
                    id="ipt_titulo"
                    name="titulo"
                    placeholder="Dê um título para sua publicação"
                    maxlength="100"
                    required>
            </div>

            <div class="campo-post">
                <label for="ipt_descricao">Descrição</label>
                <textarea
                    id="ipt_descricao"
                    name="descricao"
                    placeholder="Compartilhe seus pensamentos com a comunidade..."
                    rows="5"
                    maxlength="1000"
                    required></textarea>
            </div>

            <div class="campo-post">
                <label>Imagem da publicação</label>

                <label for="ipt_imagem" class="upload-imagem">
                    <span class="upload-icone">+</span>
                    <span>Escolha uma imagem para o post</span>
                    <span class="upload-detalhe">PNG, JPG ou JPEG</span>
                </label>

                <input
                    type="file"
                    id="ipt_imagem"
                    name="imagem"
                    accept="image/png, image/jpeg"
                    required>

                <img id="preview_imagem" alt="Pré-visualização da imagem">
            </div>

            <div class="acoes-post">
                <button type="submit" class="btn-publicar">Publicar post</button>
            </div>

        </form>

    </main>

    <div class="footer">
        <div class="container">
            <img src="assets/imgs/logo.svg" width="75px" alt="Logo">
            <h4>Desenvolvido por Davi Chagas | SPTech &copy; 2026</h4>
        </div>
    </div>

 

</body>

</html>
