
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUME | Novo Quiz</title>

    <link rel="stylesheet" href="./css/novo-quiz.css">
    <link rel="icon" href="./assets/imgs/logo.svg">
</head>

<body>

    <div class="header">
        <div class="container">
            <img src="assets/imgs/logo.svg" width="75px" alt="Logo">

            <ul class="navbar">
                <li><a href="feed.html">Feed</a></li>
                <li><a class="agora" href="quiz.html">Quizes</a></li>
                <li><a class="btn-entrar" href="perfil.html">Perfil</a></li>
                <li><a class="btn-cadastrar" href="cadastro.html">Sair</a></li>
            </ul>
        </div>
    </div>

    <div class="box">
        <h1 class="titulo-pagina">NOVO <span>QUIZ</span></h1>
    </div>

    <div class="quiz-container">

        <form class="form-quiz">

            <div class="campo-quiz">
                <label for="ipt_titulo">Título do quiz</label>
                <input
                    type="text"
                    id="ipt_titulo"
                    name="titulo"
                    placeholder="Ex: Conhecimentos sobre Naruto"
                    maxlength="100"
                    required>
            </div>

            <div class="campo-quiz">
                <label for="ipt_pergunta">Pergunta</label>
                <textarea
                    id="ipt_pergunta"
                    name="pergunta"
                    placeholder="Digite sua pergunta..."
                    rows="3"
                    required></textarea>
            </div>

            <div class="campo-quiz">
                <label>Alternativas</label>
                <p class="descricao">
                    Cadastre as quatro opções e marque a resposta correta.
                </p>

                <div class="alternativa">
                    <span class="letra">A</span>
                    <input
                        type="text"
                        name="alternativa_a"
                        placeholder="Primeira alternativa"
                        required>

                    <label class="radio-correta">
                        <input
                            type="radio"
                            name="resposta_correta"
                            value="A"
                            required>
                        Correta
                    </label>
                </div>

                <div class="alternativa">
                    <span class="letra">B</span>
                    <input
                        type="text"
                        name="alternativa_b"
                        placeholder="Segunda alternativa"
                        required>

                    <label class="radio-correta">
                        <input
                            type="radio"
                            name="resposta_correta"
                            value="B">
                        Correta
                    </label>
                </div>

                <div class="alternativa">
                    <span class="letra">C</span>
                    <input
                        type="text"
                        name="alternativa_c"
                        placeholder="Terceira alternativa"
                        required>

                    <label class="radio-correta">
                        <input
                            type="radio"
                            name="resposta_correta"
                            value="C">
                        Correta
                    </label>
                </div>

                <div class="alternativa">
                    <span class="letra">D</span>
                    <input
                        type="text"
                        name="alternativa_d"
                        placeholder="Quarta alternativa"
                        required>

                    <label class="radio-correta">
                        <input
                            type="radio"
                            name="resposta_correta"
                            value="D">
                        Correta
                    </label>
                </div>
            </div>

            <div class="acoes-quiz">
                <button type="submit" class="btn-publicar">Cadastrar quiz</button>
            </div>

        </form>

    </div>

    <div class="footer">
        <div class="container">
            <img src="assets/imgs/logo.svg" width="75px" alt="Logo">
            <h4>Desenvolvido por Davi Chagas | SPTech &copy; 2026</h4>
        </div>
    </div>

</body>

</html>
